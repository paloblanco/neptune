<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Demo — Neptune Examples</title>

  <!-- CodeMirror 5 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/theme/dracula.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js"></script>

  <style>
    :root {
      --bg:        #0d0d18;
      --surface:   #13132a;
      --panel:     #1a1a30;
      --border:    #2a2a4a;
      --accent:    #5577ff;
      --accent2:   #44aaff;
      --green:     #44cc88;
      --red:       #ff4455;
      --text:      #ccd6f6;
      --muted:     #6677aa;
      --bar-h:     44px;
      --divider-w: 5px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    #toolbar {
      height: var(--bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      flex-shrink: 0;
      user-select: none;
    }

    #toolbar .back {
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #toolbar .back:hover { color: var(--text); }

    .sep { width: 1px; height: 20px; background: var(--border); }

    #toolbar .title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    #toolbar .subtitle {
      font-size: 0.75rem;
      color: var(--muted);
    }

    #btn-run {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-run:hover { opacity: 0.85; }
    #btn-run.running { background: var(--green); }

    .auto-run-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .toggle {
      appearance: none;
      width: 30px; height: 16px;
      background: var(--border);
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle:checked { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: left 0.2s;
    }
    .toggle:checked::after { left: 16px; }

    /* ── Body layout ────────────────────────────────────────────────────────── */
    #body {
      display: flex;
      height: calc(100vh - var(--bar-h));
      overflow: hidden;
    }

    /* ── Preview panel (left) ──────────────────────────────────────────────── */
    #preview-panel {
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      background: #000;
      border-right: 1px solid var(--border);
      min-width: 200px;
    }

    #preview-panel iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }

    .panel-label {
      flex-shrink: 0;
      height: 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      gap: 8px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.green  { background: var(--green); }
    .dot.red    { background: var(--red);   }
    .dot.yellow { background: #ffdd44;      }

    /* ── Drag divider ──────────────────────────────────────────────────────── */
    #divider {
      width: var(--divider-w);
      flex-shrink: 0;
      background: var(--border);
      cursor: col-resize;
      transition: background 0.15s;
      z-index: 10;
    }
    #divider:hover, #divider.dragging { background: var(--accent); }

    /* ── Editor panel (right) ─────────────────────────────────────────────── */
    #editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 180px;
      overflow: hidden;
    }

    #editor-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* CodeMirror takes full height */
    #editor-wrap .CodeMirror {
      height: 100%;
      font-size: 13px;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      line-height: 1.55;
      background: var(--bg);
    }

    /* ── Console ───────────────────────────────────────────────────────────── */
    #console-panel {
      flex-shrink: 0;
      height: 120px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #0a0a14;
    }

    #console-log {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .log-entry { display: flex; gap: 8px; }
    .log-time  { color: var(--muted); flex-shrink: 0; }
    .log-msg   { color: var(--text); word-break: break-all; }
    .log-msg.err  { color: var(--red); }
    .log-msg.info { color: var(--accent2); }
    .log-msg.ok   { color: var(--green); }

    #console-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    #console-clear:hover { color: var(--text); }

    .panel-label { position: relative; }

    /* ── Debounce indicator ────────────────────────────────────────────────── */
    #debounce-bar {
      height: 2px;
      background: var(--accent);
      width: 0%;
      transition: width 0.05s linear;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <a class="back" href="../index.html">← Neptune</a>
    <div class="sep"></div>
    <div>
      <div class="title">Box Demo</div>
    </div>
    <span class="subtitle">init · lighting · input · 2D overlay</span>

    <div style="flex:1"></div>

    <label class="auto-run-wrap" title="Re-run automatically 1.5 s after you stop typing">
      <input type="checkbox" class="toggle" id="auto-run" checked />
      auto-run
    </label>

    <button id="btn-run" title="Run the code (Ctrl+Enter)">
      ▶ Run
    </button>
  </div>

  <!-- ── Body ── -->
  <div id="body">

    <!-- Preview -->
    <div id="preview-panel">
      <div class="panel-label">
        <span class="dot green" id="status-dot"></span>
        Preview
      </div>
      <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <!-- Drag divider -->
    <div id="divider"></div>

    <!-- Editor -->
    <div id="editor-panel">
      <div class="panel-label">
        <span class="dot yellow"></span>
        main.js
        <div style="flex:1"></div>
        <button id="console-clear" title="Clear console">clear</button>
      </div>
      <div id="debounce-bar"></div>
      <div id="editor-wrap">
        <textarea id="code-input"></textarea>
      </div>
      <div id="console-panel">
        <div class="panel-label" style="border-top:none; border-bottom:1px solid var(--border)">
          <span class="dot"></span>
          Console
        </div>
        <div id="console-log"></div>
      </div>
    </div>

  </div>

  <script>
  // ─── Initial game code ────────────────────────────────────────────────────
  // This is the code shown in the editor on load.
  // It maps 1-to-1 with what you'd put in main.js in your own project.
  const INITIAL_CODE = `import Neptune from 'neptune-engine';

// ─── Constants ───────────────────────────────────────────────────────────────
const W = 320, H = 240;
const BOX_SPEED  = 3;     // units / second
const ROT_SPEED  = 90;    // degrees / second

// ─── Game state ──────────────────────────────────────────────────────────────
let box;
let ground;
let score      = 0;
let spinToggle = false;   // 'R' key toggles auto-spin
let flashTimer = 0;       // brief color flash on keyPress demo

// ─── Setup ───────────────────────────────────────────────────────────────────
function setupScene() {
  score      = 0;
  spinToggle = false;

  // Ground plane
  ground = Neptune.createBox({
    w: 20, h: 0.25, d: 20,
    color:         '#334455',
    position:      [0, -0.125, 0],
    receiveShadow: true,
  });

  // Main box — this is the thing we drive with the keyboard
  box = Neptune.createBox({
    w: 1, h: 1, d: 1,
    color:      '#e04040',
    position:   [0, 0.5, 0],
    castShadow: true,
  });

  // A few decorative boxes to give the scene some depth
  const positions = [
    [-4, 0.35, -3], [4, 0.35, -3],
    [-3, 0.35,  3], [3, 0.35,  3],
  ];
  const colors = ['#4488cc', '#44cc88', '#cc8844', '#cc44cc'];
  positions.forEach(([x, y, z], i) => {
    Neptune.createBox({
      w: 0.7, h: 0.7, d: 0.7,
      color:         colors[i],
      position:      [x, y, z],
      castShadow:    true,
      receiveShadow: true,
    });
  });

  // Lighting
  Neptune.addLight('ambient',     { color: '#7799bb', intensity: 0.5 });
  Neptune.addLight('directional', {
    color:      '#fff5e0',
    intensity:  1.2,
    position:   [8, 12, 6],
    castShadow: true,
  });
  Neptune.addLight('point', {
    color:     '#ff6600',
    intensity: 1.5,
    position:  [0, 3, 0],
    distance:  12,
    decay:     2,
  });

  // Camera — fixed overview angle
  Neptune.camera.setMode('perspective', { fov: 60 });
  Neptune.camera.setPosition(0, 8, 12);
  Neptune.camera.lookAt(0, 0, 0);
}

// ─── Update (fixed 60 Hz) ────────────────────────────────────────────────────
Neptune.update = function update(dt) {
  score++;

  // Movement via arrow keys or WASD
  if (Neptune.keyDown('ArrowLeft')  || Neptune.keyDown('a') || Neptune.keyDown('A'))
    box.position[0] -= BOX_SPEED * dt;
  if (Neptune.keyDown('ArrowRight') || Neptune.keyDown('d') || Neptune.keyDown('D'))
    box.position[0] += BOX_SPEED * dt;
  if (Neptune.keyDown('ArrowUp')    || Neptune.keyDown('w') || Neptune.keyDown('W'))
    box.position[2] -= BOX_SPEED * dt;
  if (Neptune.keyDown('ArrowDown')  || Neptune.keyDown('s') || Neptune.keyDown('S'))
    box.position[2] += BOX_SPEED * dt;

  // Clamp to ground bounds
  box.position[0] = Neptune.math.clamp(box.position[0], -9, 9);
  box.position[2] = Neptune.math.clamp(box.position[2], -9, 9);

  // Toggle auto-spin with R
  if (Neptune.keyPress('r') || Neptune.keyPress('R')) {
    spinToggle = !spinToggle;
    flashTimer = 30;
  }

  if (spinToggle) {
    box.rotation[1] += ROT_SPEED * dt;
  }

  // Space — keyPress demo
  if (Neptune.keyPress(' ')) {
    flashTimer = 20;
  }

  if (flashTimer > 0) flashTimer--;
};

// ─── Draw (2D overlay, every rendered frame) ─────────────────────────────────
Neptune.draw = function draw() {
  const isFlashing = flashTimer > 0;

  // HUD panel (top-left)
  Neptune.rectFill(2, 2, 120, 44, 'rgba(0,0,0,0.55)');
  Neptune.rect    (2, 2, 120, 44, '#445566');
  Neptune.print('NEPTUNE ENGINE v0.1', 6, 5, { color: '#88aacc', font: '6px monospace' });
  Neptune.line(4, 14, 118, 14, '#334455');
  Neptune.print('SCORE', 6, 17, { color: '#aaaaaa', font: '7px monospace' });
  Neptune.print(String(score).padStart(7, '0'), 50, 17, { color: '#ffdd44', font: '7px monospace' });

  const spinLabel = spinToggle ? 'ON ' : 'OFF';
  const spinColor = spinToggle ? '#44ff88' : '#ff4444';
  Neptune.print('SPIN',     6, 29, { color: '#aaaaaa', font: '7px monospace' });
  Neptune.print(spinLabel, 50, 29, { color: spinColor, font: '7px monospace' });

  if (isFlashing) Neptune.circFill(112, 10, 4, '#ffdd44');

  // Controls cheatsheet (bottom-left)
  Neptune.rectFill(2, H - 48, 148, 46, 'rgba(0,0,0,0.55)');
  Neptune.rect    (2, H - 48, 148, 46, '#334455');
  [
    ['ARROWS / WASD', 'move box'],
    ['R',             'toggle spin'],
    ['SPACE',         'flash (keyPress demo)'],
  ].forEach(([key, desc], i) => {
    const y = H - 45 + i * 13;
    Neptune.print(key,   6, y, { color: '#88bbff', font: '6px monospace' });
    Neptune.print(desc, 72, y, { color: '#888888', font: '6px monospace' });
  });

  // 2D draw-call sampler (bottom-right)
  const bx = W - 70, by = H - 68;
  Neptune.rectFill(bx - 2, by - 2, 70, 68, 'rgba(0,0,0,0.55)');
  Neptune.rect    (bx - 2, by - 2, 70, 68, '#445566');
  Neptune.print('2D DRAW CALLS', bx, by, { color: '#88aacc', font: '6px monospace' });

  Neptune.rect    (bx + 2,  by + 10, 16, 10, '#ffdd44');
  Neptune.print('rect',  bx + 22, by + 11, { color: '#aaaaaa', font: '6px monospace' });

  Neptune.rectFill(bx + 2,  by + 24, 16, 10, '#44aaff');
  Neptune.print('fill',  bx + 22, by + 25, { color: '#aaaaaa', font: '6px monospace' });

  Neptune.circ    (bx + 10, by + 44, 6,  '#ff8844');
  Neptune.print('circ',  bx + 22, by + 39, { color: '#aaaaaa', font: '6px monospace' });

  Neptune.circFill(bx + 10, by + 58, 5,  '#88cc44');
  Neptune.print('cfill', bx + 22, by + 53, { color: '#aaaaaa', font: '6px monospace' });

  Neptune.line(bx + 42, by + 10, bx + 66, by + 20, '#cc44cc');
  Neptune.print('line',  bx + 42, by + 22, { color: '#aaaaaa', font: '6px monospace' });

  for (let i = 0; i < 7; i++) {
    Neptune.pixel(bx + 42 + i * 3, by + 36, \`hsl(\${(i / 7) * 360},100%,60%)\`);
  }
  Neptune.print('pixel', bx + 42, by + 39, { color: '#aaaaaa', font: '6px monospace' });
};

// ─── Init & start ─────────────────────────────────────────────────────────────
Neptune.init({
  canvas:     '#game',
  width:      W,
  height:     H,
  scale:      'fit',
  antialias:  true,
  background: '#0d0d18',
  debug:      true,
  fps:        60,
});

setupScene();
Neptune.start();
`;

  // ─── Build iframe HTML ─────────────────────────────────────────────────────
  // Neptune.js is served from the project root.
  // We build an absolute URL so srcdoc can reach it across origins.
  const NEPTUNE_URL = window.location.origin + '/src/neptune.js';
  const THREE_URL   = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
  const THREE_ADD   = 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/';

  function buildIframeHTML(userCode) {
    return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#111; overflow:hidden; }
    canvas { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three":          "${THREE_URL}",
      "three/addons/":  "${THREE_ADD}",
      "neptune-engine": "${NEPTUNE_URL}"
    }
  }
  <\/script>
  <script>
    // Forward errors to the parent editor
    window.onerror = function(msg, _src, line, col) {
      window.parent.postMessage({ type: 'neptune-error', msg: msg, line: line, col: col }, '*');
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.parent.postMessage({
        type: 'neptune-error',
        msg: (e.reason && e.reason.message) ? e.reason.message : String(e.reason)
      }, '*');
    });
  <\/script>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module">
${userCode}
  <\/script>
</body>
</html>`;
  }

  // ─── Console log helper ────────────────────────────────────────────────────
  const consoleLog = document.getElementById('console-log');

  function logEntry(msg, kind = 'info') {
    const now  = new Date();
    const time = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const el   = document.createElement('div');
    el.className = 'log-entry';
    el.innerHTML = `<span class="log-time">${time}</span><span class="log-msg ${kind}">${escHtml(msg)}</span>`;
    consoleLog.appendChild(el);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('console-clear').addEventListener('click', () => {
    consoleLog.innerHTML = '';
  });

  // ─── iframe error listener ────────────────────────────────────────────────
  const statusDot = document.getElementById('status-dot');

  window.addEventListener('message', (e) => {
    if (e.data?.type === 'neptune-error') {
      const loc = e.data.line ? ` (line ${e.data.line})` : '';
      logEntry(e.data.msg + loc, 'err');
      statusDot.classList.remove('green');
      statusDot.classList.add('red');
    }
  });

  // ─── CodeMirror editor ────────────────────────────────────────────────────
  const cm = CodeMirror.fromTextArea(document.getElementById('code-input'), {
    mode:         'javascript',
    theme:        'dracula',
    lineNumbers:  true,
    tabSize:      2,
    indentWithTabs: false,
    matchBrackets: true,
    autoCloseBrackets: true,
    extraKeys: {
      'Ctrl-Enter': runCode,
      'Cmd-Enter':  runCode,
    },
  });

  cm.setValue(INITIAL_CODE);

  // ─── Run logic ─────────────────────────────────────────────────────────────
  const preview = document.getElementById('preview');
  const runBtn  = document.getElementById('btn-run');

  function runCode() {
    const code = cm.getValue();
    statusDot.className = 'dot yellow';
    runBtn.classList.remove('running');

    // Swap iframe content — the simplest clean-restart approach
    preview.srcdoc = buildIframeHTML(code);

    // After a short delay, mark as running (we can't know exact completion)
    setTimeout(() => {
      statusDot.className = 'dot green';
      runBtn.classList.add('running');
    }, 800);

    logEntry('Running…', 'ok');
  }

  runBtn.addEventListener('click', runCode);

  // ─── Auto-run with debounce ───────────────────────────────────────────────
  const debounceBar  = document.getElementById('debounce-bar');
  const DEBOUNCE_MS  = 1500;
  let   debounceTimer = null;
  let   debounceStart = 0;
  let   barRaf        = null;

  function cancelDebounce() {
    clearTimeout(debounceTimer);
    cancelAnimationFrame(barRaf);
    debounceBar.style.width = '0%';
    debounceBar.style.transition = 'none';
  }

  function animateBar() {
    const elapsed = Date.now() - debounceStart;
    const pct     = Math.min(100, (elapsed / DEBOUNCE_MS) * 100);
    debounceBar.style.width = pct + '%';
    if (pct < 100) barRaf = requestAnimationFrame(animateBar);
  }

  cm.on('change', () => {
    if (!document.getElementById('auto-run').checked) return;
    cancelDebounce();
    debounceStart = Date.now();
    debounceBar.style.transition = '';
    barRaf = requestAnimationFrame(animateBar);
    debounceTimer = setTimeout(() => {
      cancelDebounce();
      runCode();
    }, DEBOUNCE_MS);
  });

  // ─── Divider drag to resize panels ──────────────────────────────────────
  const divider      = document.getElementById('divider');
  const previewPanel = document.getElementById('preview-panel');
  let   dragging     = false;

  divider.addEventListener('mousedown', (e) => {
    dragging = true;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const bodyRect = document.getElementById('body').getBoundingClientRect();
    const pct = Math.max(20, Math.min(80,
      ((e.clientX - bodyRect.left) / bodyRect.width) * 100
    ));
    previewPanel.style.flex = `0 0 ${pct}%`;
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // ─── Run on load ──────────────────────────────────────────────────────────
  runCode();
  </script>
</body>
</html>
