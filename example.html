<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neptune — End-to-End Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #111;
      overflow: hidden;
    }
    /* Neptune creates a fixed-position container for the canvases;
       the <canvas> below is the Three.js render target. */
    canvas { display: block; }
  </style>

  <!--
    Import map wires up bare specifiers used by neptune.js.
    Three r170 — change the version here if you need a different one.
  -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "neptune-engine": "./src/neptune.js"
    }
  }
  </script>
</head>
<body>

  <!-- Neptune will take over this canvas element. -->
  <canvas id="game"></canvas>

  <script type="module">
import Neptune from 'neptune-engine';

// ─── Constants ───────────────────────────────────────────────────────────────
const W = 320, H = 240;
const BOX_SPEED  = 3;     // units / second
const ROT_SPEED  = 90;    // degrees / second

// ─── Game state ──────────────────────────────────────────────────────────────
let box;
let ground;
let score      = 0;
let spinToggle = false;   // 'R' key toggles auto-spin
let flashTimer = 0;       // brief color flash on keyPress demo

// ─── Setup ───────────────────────────────────────────────────────────────────
function setupScene() {
  score      = 0;
  spinToggle = false;

  // Ground plane
  ground = Neptune.createBox({
    w: 20, h: 0.25, d: 20,
    color:         '#334455',
    position:      [0, -0.125, 0],
    receiveShadow: true,
  });

  // Main box — this is the thing we drive with the keyboard
  box = Neptune.createBox({
    w: 1, h: 1, d: 1,
    color:      '#e04040',
    position:   [0, 0.5, 0],
    castShadow: true,
  });

  // A few decorative boxes to give the scene some depth
  const positions = [
    [-4,  0.35, -3], [4,   0.35, -3],
    [-3,  0.35,  3], [3,   0.35,  3],
  ];
  const colors = ['#4488cc', '#44cc88', '#cc8844', '#cc44cc'];
  positions.forEach(([x, y, z], i) => {
    Neptune.createBox({
      w: 0.7, h: 0.7, d: 0.7,
      color:         colors[i],
      position:      [x, y, z],
      castShadow:    true,
      receiveShadow: true,
    });
  });

  // Lighting
  Neptune.addLight('ambient',      { color: '#7799bb', intensity: 0.5 });
  Neptune.addLight('directional',  {
    color:       '#fff5e0',
    intensity:   1.2,
    position:    [8, 12, 6],
    castShadow:  true,
  });
  Neptune.addLight('point', {
    color:    '#ff6600',
    intensity: 1.5,
    position:  [0, 3, 0],
    distance:  12,
    decay:     2,
  });

  // Camera — fixed overview angle
  Neptune.camera.setMode('perspective', { fov: 60 });
  Neptune.camera.setPosition(0, 8, 12);
  Neptune.camera.lookAt(0, 0, 0);
}

// ─── Update (fixed 60 Hz) ────────────────────────────────────────────────────
Neptune.update = function update(dt) {
  score++;

  // Movement via arrow keys or WASD
  if (Neptune.keyDown('ArrowLeft')  || Neptune.keyDown('a') || Neptune.keyDown('A'))
    box.position[0] -= BOX_SPEED * dt;
  if (Neptune.keyDown('ArrowRight') || Neptune.keyDown('d') || Neptune.keyDown('D'))
    box.position[0] += BOX_SPEED * dt;
  if (Neptune.keyDown('ArrowUp')    || Neptune.keyDown('w') || Neptune.keyDown('W'))
    box.position[2] -= BOX_SPEED * dt;
  if (Neptune.keyDown('ArrowDown')  || Neptune.keyDown('s') || Neptune.keyDown('S'))
    box.position[2] += BOX_SPEED * dt;

  // Clamp to ground bounds
  box.position[0] = Neptune.math.clamp(box.position[0], -9, 9);
  box.position[2] = Neptune.math.clamp(box.position[2], -9, 9);

  // Toggle auto-spin with R
  if (Neptune.keyPress('r') || Neptune.keyPress('R')) {
    spinToggle = !spinToggle;
    flashTimer = 30; // frames
  }

  if (spinToggle) {
    box.rotation[1] += ROT_SPEED * dt;
  }

  // Space — jump (instant Y pop, purely cosmetic here)
  if (Neptune.keyPress(' ')) {
    flashTimer = 20;
  }

  if (flashTimer > 0) flashTimer--;
};

// ─── Draw (2D overlay, every rendered frame) ─────────────────────────────────
Neptune.draw = function draw() {
  const isFlashing = flashTimer > 0;

  // ── HUD panel (top-left) ─────────────────────────────────────────────
  Neptune.rectFill(2, 2, 120, 44, 'rgba(0,0,0,0.55)');
  Neptune.rect    (2, 2, 120, 44, '#445566');

  Neptune.print('NEPTUNE ENGINE v0.1', 6, 5, { color: '#88aacc', font: '6px monospace' });
  Neptune.line(4, 14, 118, 14, '#334455');

  Neptune.print('SCORE', 6, 17, { color: '#aaaaaa', font: '7px monospace' });
  Neptune.print(String(score).padStart(7, '0'), 50, 17, { color: '#ffdd44', font: '7px monospace' });

  const spinLabel = spinToggle ? 'ON ' : 'OFF';
  const spinColor = spinToggle ? '#44ff88' : '#ff4444';
  Neptune.print('SPIN',     6, 29, { color: '#aaaaaa', font: '7px monospace' });
  Neptune.print(spinLabel, 50, 29, { color: spinColor, font: '7px monospace' });

  // Flash dot when a key event fires
  if (isFlashing) {
    Neptune.circFill(112, 10, 4, '#ffdd44');
  }

  // ── Controls cheatsheet (bottom-left) ────────────────────────────────
  Neptune.rectFill(2, H - 48, 148, 46, 'rgba(0,0,0,0.55)');
  Neptune.rect    (2, H - 48, 148, 46, '#334455');

  const controls = [
    ['ARROWS / WASD', 'move box'],
    ['R',             'toggle spin'],
    ['SPACE',         'flash (keyPress demo)'],
  ];
  controls.forEach(([key, desc], i) => {
    const y = H - 45 + i * 13;
    Neptune.print(key,   6, y, { color: '#88bbff', font: '6px monospace' });
    Neptune.print(desc, 72, y, { color: '#888888', font: '6px monospace' });
  });

  // ── 2D draw call sampler (bottom-right) ──────────────────────────────
  const bx = W - 70, by = H - 68;
  Neptune.rectFill(bx - 2, by - 2, 70, 68, 'rgba(0,0,0,0.55)');
  Neptune.rect    (bx - 2, by - 2, 70, 68, '#445566');

  Neptune.print('2D DRAW CALLS', bx, by, { color: '#88aacc', font: '6px monospace' });

  // rect outline
  Neptune.rect(bx + 2, by + 10, 16, 10, '#ffdd44');
  Neptune.print('rect',    bx + 22, by + 11, { color: '#aaaaaa', font: '6px monospace' });

  // filled rect
  Neptune.rectFill(bx + 2, by + 24, 16, 10, '#44aaff');
  Neptune.print('fill',    bx + 22, by + 25, { color: '#aaaaaa', font: '6px monospace' });

  // circle outline
  Neptune.circ(bx + 10, by + 44, 6, '#ff8844');
  Neptune.print('circ',    bx + 22, by + 39, { color: '#aaaaaa', font: '6px monospace' });

  // filled circle
  Neptune.circFill(bx + 10, by + 58, 5, '#88cc44');
  Neptune.print('cfill',   bx + 22, by + 53, { color: '#aaaaaa', font: '6px monospace' });

  // line
  Neptune.line(bx + 42, by + 10, bx + 66, by + 20, '#cc44cc');
  Neptune.print('line',    bx + 42, by + 22, { color: '#aaaaaa', font: '6px monospace' });

  // pixels
  for (let i = 0; i < 7; i++) {
    const hue = (i / 7) * 360;
    Neptune.pixel(bx + 42 + i * 3, by + 36, `hsl(${hue},100%,60%)`);
  }
  Neptune.print('pixel',   bx + 42, by + 39, { color: '#aaaaaa', font: '6px monospace' });
};

// ─── Init & start ─────────────────────────────────────────────────────────────
Neptune.init({
  canvas:     '#game',
  width:      W,
  height:     H,
  scale:      'fit',
  antialias:  true,           // smooth edges for this demo
  pixelArt:   false,
  background: '#0d0d18',
  debug:      true,
  fps:        60,
});

// No external assets for this demo — set up the scene immediately and start.
setupScene();
Neptune.start();
  </script>
</body>
</html>
